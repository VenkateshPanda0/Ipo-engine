# Prometheus alert rules for IPO Engine. Scrape /metrics with an admin token:
#   - job_name: ipo-engine
#     metrics_path: /metrics
#     authorization: { credentials_file: /etc/prometheus/ipo-token }
#     static_configs: [{ targets: ["api:8000"] }]
groups:
  - name: ipo-engine
    rules:
      - alert: IpoApiDown
        expr: up{job="ipo-engine"} == 0
        for: 2m
        labels: { severity: page }
        annotations: { summary: "The IPO Engine API is not answering scrapes" }

      - alert: IpoDatabaseUnreadable
        expr: ipo_state_scrape_ok == 0
        for: 2m
        labels: { severity: page }
        annotations: { summary: "The API cannot read its database" }

      - alert: IpoServerErrors
        expr: sum(rate(ipo_http_requests_total{status=~"5.."}[5m])) / sum(rate(ipo_http_requests_total[5m])) > 0.02
        for: 10m
        labels: { severity: page }
        annotations: { summary: "More than 2% of requests fail with a server error" }

      - alert: IpoSlowRequests
        expr: histogram_quantile(0.95, sum by (le) (rate(ipo_http_request_duration_seconds_bucket[5m]))) > 2
        for: 15m
        labels: { severity: ticket }
        annotations: { summary: "The 95th percentile request takes over 2 seconds" }

      - alert: IpoDocumentQueueBacklog
        expr: ipo_jobs_waiting > 20
        for: 15m
        labels: { severity: ticket }
        annotations: { summary: "Documents are waiting for a worker; add workers or check that they run" }

      - alert: IpoNoWorkersWhileWaiting
        expr: ipo_jobs_waiting > 0 and ipo_jobs_running == 0
        for: 10m
        labels: { severity: page }
        annotations: { summary: "Documents are queued and nothing is processing them" }

      - alert: IpoDocumentsFailing
        expr: increase(ipo_jobs_failed[1h]) > 5
        for: 0m
        labels: { severity: ticket }
        annotations: { summary: "Several documents failed to process in the last hour" }

      - alert: IpoWebhooksFailing
        expr: ipo_webhook_deliveries_failed > 0
        for: 30m
        labels: { severity: ticket }
        annotations: { summary: "Some webhook deliveries were given up on" }
