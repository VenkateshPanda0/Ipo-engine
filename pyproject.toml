[project]
name = "ipo-engine"
version = "0.3.0"
description = "IPO due diligence for Indian offer documents: a page-cited, offline reader and an eligibility screening app."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Venkatesh Panda", email = "venkateshpanda00@gmail.com" }
]
keywords = ["IPO", "SEBI", "DRHP", "due diligence", "compliance"]
requires-python = ">=3.12"
dependencies = [
    # reader core
    "pydantic>=2.7",
    "pdfplumber>=0.11,<0.12",
    "pypdfium2>=4.30",
    # screening app (API, persistence, reports, OCR)
    "pydantic-settings>=2.3",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "sqlalchemy>=2.0.30,<3",
    "alembic>=1.13,<2",
    "jinja2>=3.1",
    "pikepdf>=9.0",
    "pytesseract>=0.3",
    "pillow>=10.4",
    "numpy>=1.26",  # OCR deskew (projection profiles)
    "cryptography>=43",
]

[project.scripts]
ipo = "ipo_engine.cli:main"

[project.optional-dependencies]
postgres = [
    "psycopg[binary]>=3.2",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "hypothesis>=6.100",
    "reportlab>=4.2",  # test fixtures only: synthetic PDFs
    "ruff>=0.6",
    "mypy>=1.11",
    "pip-audit>=2.7",
    "pre-commit>=4.7.0",
    "pyyaml>=6.0.3",
    "types-pyyaml>=6.0.12.20261122",
]

[build-system]
requires = ["uv_build>=0.11.32,<0.14.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --tb=short"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    # raised inside FastAPI's test client import; nothing in this project to change
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]
markers = [
    "unit: Unit tests that run in isolation with no external dependencies",
    "integration: Integration tests that exercise multiple components together",
    "regression: Regression tests using golden datasets",
    "slow: Tests that take more than 1 second to run",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["src/ipo_engine/screening/db/migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
# Real filings use en/figure dashes, Unicode minus, multiplication signs and NBSP in numeric cells;
# the parsers match them, and docstrings that describe them use them too.
ignore = ["RUF001", "RUF002"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's parameter markers are meant to appear as argument defaults (B008 would flag every route).
extend-immutable-calls = [
    "fastapi.Depends", "fastapi.Query", "fastapi.Header", "fastapi.Path", "fastapi.Body",
    "fastapi.File", "fastapi.Form", "fastapi.Security",
]

[tool.ruff.lint.per-file-ignores]
"src/ipo_engine/report_html.py" = ["E501"]  # inline CSS and HTML template lines
"tools/screening/benchmark_extraction.py" = ["E501"]  # markdown report templates
# The screening app's public enums are `class X(str, Enum)` and are serialised and compared as
# strings in the API, stored data and tests. `StrEnum` changes `str()` and formatting of a member
# (UP042), so it is not a mechanical swap; and `ExtractedValue` is a pydantic generic model, where
# PEP 695 syntax (UP046) is untried with the pydantic mypy plugin. Both need a deliberate change.
"src/ipo_engine/screening/**" = ["UP042", "UP046"]
# conftest sets environment variables before it imports the application, so the imports must follow.
"tests/screening/conftest.py" = ["E402"]

[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
exclude = ["src/ipo_engine/screening/db/migrations/"]
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true
no_implicit_optional = true

# Strict where the extraction and screening logic lives.
[[tool.mypy.overrides]]
module = [
    "ipo_engine.extract.*",
    "ipo_engine.verify.*",
    "ipo_engine.flags.*",
    "ipo_engine.eval.*",
    "ipo_engine.screening.*",
]
strict = true

# Untyped third-party libraries.
[[tool.mypy.overrides]]
module = [
    "pdfplumber", "pdfplumber.*", "pypdfium2", "pypdfium2.*",
    "camelot.*", "easyocr.*", "pytesseract.*", "pikepdf.*", "reportlab", "reportlab.*",
]
ignore_missing_imports = true
