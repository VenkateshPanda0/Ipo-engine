[project]
name = "ipo-engine"
version = "0.3.0"
description = "IPO due diligence for Indian offer documents: a page-cited, offline reader and an eligibility screening app."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Venkatesh Panda", email = "166646817+VenkateshPanda0@users.noreply.github.com" }
]
keywords = ["IPO", "SEBI", "DRHP", "due diligence", "compliance"]
requires-python = ">=3.12"
dependencies = [
    # reader core
    "pydantic>=2.7",
    "pdfplumber>=0.11,<0.12",
    "pypdfium2>=4.30",
    # screening app (API, persistence, reports, OCR)
    "pydantic-settings>=2.3",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "sqlalchemy>=2.0.30,<3",
    "alembic>=1.13,<2",
    "jinja2>=3.1",
    "pikepdf>=9.0",
    "pytesseract>=0.3",
    "pillow>=10.4",
    "numpy>=1.26",  # OCR deskew (projection profiles)
]

[project.scripts]
ipo = "ipo_engine.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "hypothesis>=6.100",
    "reportlab>=4.2",  # test fixtures only: synthetic PDFs
    "ruff>=0.6",
    "mypy>=1.11",
    "pip-audit>=2.7",
]

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --tb=short"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    # raised inside FastAPI's test client import; nothing in this project to change
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]
markers = [
    "unit: Unit tests that run in isolation with no external dependencies",
    "integration: Integration tests that exercise multiple components together",
    "regression: Regression tests using golden datasets",
    "slow: Tests that take more than 1 second to run",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["src/ipo_engine/screening/db/migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
# Real filings use en/figure dashes, Unicode minus and NBSP in numeric cells; parsers match them.
ignore = ["RUF001"]

[tool.ruff.lint.per-file-ignores]
"src/ipo_engine/report_html.py" = ["E501"]  # inline CSS and HTML template lines
"tools/screening/benchmark_extraction.py" = ["E501"]  # markdown report templates
# The screening app keeps its earlier conventions (FastAPI defaults, str-Enum public API, long docstrings).
"src/ipo_engine/screening/**" = ["B008", "UP042", "UP046", "RUF012", "RUF005", "RUF002", "RUF003", "RUF007", "RUF022", "SIM108", "E501"]
"tests/screening/**" = ["B008", "RUF012", "RUF005", "RUF002", "RUF003", "SIM108", "E501", "E402"]

[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
exclude = ["tests/screening/", "src/ipo_engine/screening/db/migrations/"]
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true
no_implicit_optional = true

# Strict where the extraction and screening logic lives.
[[tool.mypy.overrides]]
module = [
    "ipo_engine.extract.*",
    "ipo_engine.verify.*",
    "ipo_engine.flags.*",
    "ipo_engine.eval.*",
    "ipo_engine.screening.*",
]
strict = true

# Untyped third-party libraries.
[[tool.mypy.overrides]]
module = [
    "pdfplumber", "pdfplumber.*", "pypdfium2", "pypdfium2.*",
    "camelot.*", "easyocr.*", "pytesseract.*", "pikepdf.*",
]
ignore_missing_imports = true
