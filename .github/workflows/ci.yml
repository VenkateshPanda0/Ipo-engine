name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.11.32"   # the version the lockfile and the Docker image use

jobs:
  python:
    name: python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ matrix.python }}
          enable-cache: true
      - name: Install dependencies (locked)
        run: uv sync --frozen --all-extras
      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .
      - name: Type-check
        run: uv run mypy
      - name: Tests, with a coverage floor
        run: uv run pytest -q --cov=ipo_engine --cov-report=term --cov-report=xml --cov-fail-under=92
      - name: Keep the coverage report
        if: matrix.python == '3.12'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-xml
          path: coverage.xml
      - name: Build the package
        if: matrix.python == '3.12'
        run: uv build --wheel
      - name: Known vulnerabilities in dependencies
        if: matrix.python == '3.12'
        run: uv run pip-audit --progress-spinner off

  postgres:
    name: postgres 16
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_INITDB_ARGS: "--encoding=UTF8"
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s
          --health-retries 10
    env:
      IPO_TEST_PG_ADMIN_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --frozen --all-extras
      - name: The application tests, against PostgreSQL instead of SQLite
        run: uv run pytest tests/screening -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Type-check
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Known vulnerabilities (shipped and test tooling)
        run: npm audit --audit-level=high

  docs-links:
    name: documentation links (offline)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Offline: checks that relative links and images in the Markdown files point at files that
      # exist. (tests/test_docs.py checks the same, plus that no document is orphaned.)
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --offline --no-progress --exclude-path node_modules --exclude-path .venv "./**/*.md"
          fail: true

  e2e:
    name: end-to-end (Chromium)
    # Not ubuntu-latest: that is now Ubuntu 26.04, which the locked Playwright (1.56) does not support.
    runs-on: ubuntu-24.04
    env:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.12"
          enable-cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: uv sync --frozen
      - name: Install the web app and Chromium
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run build
      - name: Start the API and the web app
        run: |
          mkdir -p "$RUNNER_TEMP/ipo-e2e"
          APP_ENV=development DATA_DIR="$RUNNER_TEMP/ipo-e2e" \
            DATABASE_URL="sqlite:///$RUNNER_TEMP/ipo-e2e/e2e.db" \
            nohup uv run ipo serve > "$RUNNER_TEMP/api.log" 2>&1 &
          (cd frontend && nohup npm start > "$RUNNER_TEMP/web.log" 2>&1 &)
          for i in $(seq 1 60); do
            curl -fsS http://localhost:8000/api/v1/system/health > /dev/null \
              && curl -fsS http://localhost:3000/ > /dev/null && exit 0
            sleep 1
          done
          echo "servers did not start"; tail -20 "$RUNNER_TEMP/api.log" "$RUNNER_TEMP/web.log"; exit 1
      - name: Playwright
        working-directory: frontend
        run: npx playwright test --trace off
      - name: Restart the API in accounts mode, with an admin and a token
        run: |
          pkill -f "ipo serve" || true
          sleep 1
          export ACCOUNTS_ENABLED=true APP_ENV=development
          export DATA_DIR="$RUNNER_TEMP/ipo-e2e-acc"
          export DATABASE_URL="sqlite:///$RUNNER_TEMP/ipo-e2e-acc/e.db"
          mkdir -p "$DATA_DIR"
          ORG=$(uv run ipo accounts create-org "E2E" | awk '{print $2}')
          uv run ipo accounts add-member "$ORG" admin@e2e.example --role admin
          uv run ipo accounts add-member "$ORG" helper@e2e.example --role analyst
          uv run ipo accounts create-token "$ORG" admin@e2e.example --name e2e 2>/dev/null > "$RUNNER_TEMP/e2e-token"
          nohup uv run ipo serve > "$RUNNER_TEMP/api-accounts.log" 2>&1 &
          for i in $(seq 1 60); do
            curl -fsS http://localhost:8000/api/v1/auth/providers | grep -q '"accounts":true' && exit 0
            sleep 1
          done
          echo "accounts API did not start"; tail -20 "$RUNNER_TEMP/api-accounts.log"; exit 1
      - name: Playwright, accounts mode (sign-in, team, comments, exports)
        working-directory: frontend
        run: E2E_ACCOUNTS_TOKEN="$(cat "$RUNNER_TEMP/e2e-token")" npx playwright test --trace off
      - name: Keep the report and server logs when it fails
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-failure
          path: |
            frontend/test-results
            ${{ runner.temp }}/api.log
            ${{ runner.temp }}/api-accounts.log
            ${{ runner.temp }}/web.log
          if-no-files-found: ignore
