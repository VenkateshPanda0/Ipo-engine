# Weekly dependency updates, minor and patch grouped into one pull request per ecosystem;
# majors arrive on their own so each can be read. Security updates are separate and immediate.
version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule: { interval: weekly, day: monday }
    groups:
      python-minor-and-patch:
        update-types: [minor, patch]
    commit-message: { prefix: "chore(deps)" }

  - package-ecosystem: npm
    directory: /frontend
    schedule: { interval: weekly, day: monday }
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
    commit-message: { prefix: "chore(deps)" }

  - package-ecosystem: docker
    directory: /
    schedule: { interval: weekly, day: monday }
    commit-message: { prefix: "chore(docker)" }

  - package-ecosystem: docker
    directory: /frontend
    schedule: { interval: weekly, day: monday }
    commit-message: { prefix: "chore(docker)" }

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday }
    groups:
      actions-minor-and-patch:
        update-types: [minor, patch]
    commit-message: { prefix: "chore(ci)" }
